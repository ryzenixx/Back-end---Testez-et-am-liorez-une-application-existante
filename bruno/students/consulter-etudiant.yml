info:
  name: Consulter un étudiant
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/students/{{studentId}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.email
      operator: eq
      value: camille.martin@example.org
